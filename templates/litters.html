<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Werpsels · Amadeus Farm</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/farmDashboardV2.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/littersRegisterV2.css') }}">
</head>
<body>
  <div class="farm-app-shell">
    {% include '_farm_nav.html' %}
    <main class="litter-register">
      <header class="litter-hero">
        <div>
          <span class="farm-eyebrow">HERD · BREEDING</span>
          <h1>Werpsels</h1>
          <p id="litters_subtitle">Laai die huidige werpselrekords…</p>
        </div>
        <div class="litter-hero-actions">
          <a href="/verwagte-jongdatums" class="secondary-action">Verwagte Jong Datums</a>
          <a href="/master/add-litter" class="primary-action">+ Voeg Werpsel By</a>
        </div>
      </header>

      <div id="litters_message" class="message-box hidden"></div>

      <section class="litter-metrics" aria-label="Werpsel opsomming">
        <button type="button" class="metric-card is-active" data-summary-filter="active">
          <span class="metric-icon">◉</span><small>Aktiewe Werpsels</small><strong id="litters_current">–</strong><em>Voor speen afgehandel word</em>
        </button>
        <button type="button" class="metric-card metric-attention" data-summary-filter="attention">
          <span class="metric-icon">!</span><small>Aandag Nodig</small><strong id="litters_attention">–</strong><em>Volgende aksie is gereed</em>
        </button>
        <button type="button" class="metric-card" data-summary-filter="weaned">
          <span class="metric-icon">↗</span><small>Gespeende Werpsels</small><strong id="litters_weaning">–</strong><em>Nageslag bly naspoorbaar</em>
        </button>
        <button type="button" class="metric-card" data-summary-filter="completed">
          <span class="metric-icon">✓</span><small>Afgesluit</small><strong id="litters_completed">–</strong><em>Volledige uitkomsrekords</em>
        </button>
      </section>

      <section id="attention_panel" class="litter-attention-panel hidden" aria-labelledby="attention_title">
        <div><span class="farm-eyebrow">DOEN VOLGENDE</span><h2 id="attention_title">Werpsels wat aandag nodig het</h2></div>
        <div id="attention_cards" class="attention-cards"></div>
      </section>

      <section class="litter-register-workspace">
        <div class="workspace-heading">
          <div><span class="farm-eyebrow">WERPSELREGISTER</span><h2 id="view_title">Aktiewe werpsels</h2></div>
          <span id="view_count" class="record-count">–</span>
        </div>

        <div class="litter-toolbar">
          <label class="search-field"><span>Soek</span><input id="litters_search" type="search" placeholder="Sog, beer of werpselnommer" /></label>
          <div class="filter-tabs" role="group" aria-label="Filtreer werpsels">
            <button type="button" class="is-active" data-filter="active">Aktief</button>
            <button type="button" data-filter="attention">Aandag</button>
            <button type="button" data-filter="weaned">Gespeen</button>
            <button type="button" data-filter="completed">Afgesluit</button>
            <button type="button" data-filter="all">Alles</button>
          </div>
        </div>

        <div id="litters_cards" class="litter-card-grid" aria-live="polite">
          <div class="register-empty">Laai werpsels…</div>
        </div>
      </section>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/litters.js') }}"></script>
</body>
</html>
