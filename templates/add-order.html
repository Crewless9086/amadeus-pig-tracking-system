<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Order</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  <div class="page-shell">
    <div class="page-card">
      <div class="page-header page-header-with-link">
        <div>
          <h1>Livestock request &amp; draft quote preview</h1>
          <p>Capture the customer request once. Previewing does not create an order or attach pigs.</p>
        </div>
        <a href="/orders" class="secondary-link">← Orders</a>
      </div>

      <form id="addOrderForm" class="weight-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="order_date">Order Date</label>
            <input id="order_date" name="order_date" type="date" required />
          </div>

          <div class="form-group">
            <label for="customer_name">Customer Name</label>
            <input id="customer_name" name="customer_name" type="text" required />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="customer_phone">Customer Phone</label>
            <input id="customer_phone" name="customer_phone" type="text" />
          </div>

          <div class="form-group">
            <label for="customer_channel">Customer Channel</label>
            <select id="customer_channel" name="customer_channel" required>
              <option value="">Select</option>
              <option value="WhatsApp">WhatsApp</option>
              <option value="Telegram">Telegram</option>
              <option value="Instagram">Instagram</option>
              <option value="Messenger">Messenger</option>
              <option value="Web Chat">Web Chat</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="customer_language">Customer Language</label>
            <select id="customer_language" name="customer_language" required>
              <option value="">Select</option>
              <option value="English">English</option>
              <option value="Afrikaans">Afrikaans</option>
            </select>
          </div>

          <div class="form-group">
            <label for="order_source">Order Source</label>
            <select id="order_source" name="order_source" required>
              <option value="">Select</option>
              <option value="App">App</option>
              <option value="Sam">Sam</option>
              <option value="Human">Human</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
        </div>

        <section class="operation-section">
          <div class="section-title-row"><div><h2>Customer request</h2><p>Requested quantities only — no animal selection or reservation.</p></div><button id="add_request_line" type="button" class="small-action-button">Add line</button></div>
          <div id="requested_items_editor"></div>
        </section>

        <div class="form-grid">
          <div class="form-group">
            <label for="quoted_total">Quoted Total</label>
            <input id="quoted_total" name="quoted_total" type="number" step="0.01" />
          </div>

          <div class="form-group">
            <label for="created_by">Created By</label>
            <input id="created_by" name="created_by" type="text" value="App" />
          </div>
        </div>

        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit">Build local draft quote preview</button>
        </div>

        <div id="add_order_message" class="message-box hidden"></div>
        <section id="livestock_preview" class="operation-section hidden" aria-live="polite"></section>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/addOrder.js') }}"></script>
</body>
</html>
