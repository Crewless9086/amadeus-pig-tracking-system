AllowAnyRoot No
AllowExpiredCerts No
ServerName /run/cups/cups.sock
# The client reaches only the local Unix socket. The fixed remote printer URI
# remains the exact configured private `ipp://<ip>:631/printers/<queue>` endpoint.
Encryption IfRequested
SSLOptions DenyTLS1.0
TrustOnFirstUse No
ValidateCerts Yes
