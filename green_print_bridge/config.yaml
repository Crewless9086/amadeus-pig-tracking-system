name: Amadeus Green Print Bridge
version: "0.3.7"
slug: amadeus_green_print_bridge
description: Fail-closed outbound weekly weighing-sheet adapter with private IPPS
url: https://github.com/Crewless9086/amadeus-pig-tracking-system
image: ghcr.io/crewless9086/amadeus-green-print-bridge
stage: experimental
startup: application
boot: auto
init: false
arch:
  - aarch64
tmpfs: true
backup: cold
backup_exclude:
  - "spool/**"
options:
  canonical_transport_profile: private_pinned
  canonical_api_origin: null
  canonical_endpoint_ip: ""
  canonical_bearer_token: null
  farm_scope_id: null
  green_id: null
  printer_id: null
  cups_queue_id: null
  registry_version: null
  printer_uri: null
  printer_transport_profile: private_ipps
  printer_endpoint_ip: null
  printer_certificate_sha256: null
  poll_seconds: 30
schema:
  canonical_transport_profile: list(private_pinned|public_pki_exact_origin)
  canonical_api_origin: url
  canonical_endpoint_ip: str
  canonical_bearer_token: password
  farm_scope_id: str
  green_id: str
  printer_id: str
  cups_queue_id: str
  registry_version: str
  printer_uri: str
  printer_transport_profile: list(private_ipps)
  printer_endpoint_ip: str
  printer_certificate_sha256: str
  poll_seconds: int(5,3600)
map: []
apparmor: true
host_network: false
privileged: []
full_access: false
docker_api: false
audio: false
video: false
usb: false
uart: false
gpio: false
udev: false
stdin: false
