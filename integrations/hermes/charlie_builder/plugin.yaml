name: charlie-builder
version: "1.0.0"
description: Bounded CHARLIE mission supervisor with one native structured-patch executor.
# Registration owns the exact protected-configuration check.  Hermes' static
# directory-plugin preflight does not have the profile environment overlay and
# must not reject an otherwise valid profile before register(ctx) runs.
requires_env: []
provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
