name: CHARLIE CORE Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mission-admission:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mission_admission_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mission_admission_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mission_admission_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run Mission Admission Guard contract tests
        run: >-
          python -m unittest tests.test_charlie_mission_admission
          tests.test_charlie_mission_admission_delivery -q
      - name: Run disposable PostgreSQL admission transaction tests
        env:
          CHARLIE_DISPOSABLE_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: >-
          python -m unittest
          tests.test_charlie_mission_admission.MissionAdmissionPostgresTests -q
      - name: Import current provider claims into disposable mission authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_HEAD_REF" = "cursor/mission-admission-stage2-20260827" ]; then
            export MISSION_ID="CMQ-20260813-05-STAGE2-ADMISSION"
            export ROOT_MISSION_ID="CMQ-20260813-05"
          else
            export MISSION_ID="CMQ-20260813-05"
            export ROOT_MISSION_ID="CMQ-20260813-05"
          fi
          gh api graphql -f query='
            query {
              repository(owner:"Crewless9086", name:"amadeus-pig-tracking-system") {
                pullRequests(first:100, states:OPEN, orderBy:{field:UPDATED_AT,direction:DESC}) {
                  nodes {
                    number
                    headRefName
                    updatedAt
                    files(first:100) { nodes { path } }
                  }
                }
              }
            }' > "$RUNNER_TEMP/open-pr-claims.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone

          import psycopg

          mission_id = os.environ["MISSION_ID"]
          root_mission_id = os.environ["ROOT_MISSION_ID"]
          now = datetime.now(timezone.utc)
          claims = json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "open-pr-claims.json"),
              encoding="utf-8",
          ))["data"]["repository"]["pullRequests"]["nodes"]
          correction = {
              "contract_version": "core_mission_control_event.v1",
              "mission_id": mission_id,
              "event_type": "owner_correction_recorded",
              "summary": (
                  "Independent SEND_BACK for rejected head "
                  "e358306bfaf6228f4097de8f0adf1c748d6ff3f2."
              ),
              "recorded_by": "owner-charl",
              "recorded_at": now.isoformat(),
              "outcome": "Correct PR #1307 in the same mission and branch.",
              "real_life_state": "prepared",
              "first_missing_acceptance_gate": "fresh_independent_review",
              "current_worker": "cursor/mission-admission-guard-80dd",
              "next_automatic_step": "independent_review",
              "owner_action": "NONE",
              "corrects_event_id": "PR1307-REJECTED-E358306B",
              "accepted": None,
              "evidence_refs": [
                  "PR #1307",
                  "e358306bfaf6228f4097de8f0adf1c748d6ff3f2",
              ],
          }
          correction["event_id"] = "CORE-MISSION-CONTROL-" + hashlib.sha256(
              f"{mission_id}|owner_correction_recorded|pr1307-send-back-e358306b".encode()
          ).hexdigest()[:24].upper()
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      drop table if exists public.operational_events cascade;
                      drop table if exists public.charlie_mission_events cascade;
                      drop table if exists public.charlie_missions cascade;
                      create table public.charlie_missions (
                          mission_id text primary key,
                          status text not null,
                          metadata_json jsonb not null default '{}'::jsonb,
                          updated_at timestamptz not null default now()
                      );
                      create table public.charlie_mission_events (
                          event_id text primary key,
                          mission_id text not null,
                          event_type text not null,
                          notes text,
                          recorded_by text,
                          metadata_json jsonb not null default '{}'::jsonb,
                          created_at timestamptz not null default now()
                      );
                      create table public.operational_events (
                          event_id text primary key,
                          idempotency_key text unique not null,
                          schema_version text not null,
                          event_type text not null,
                          domain text not null,
                          aggregate_type text not null,
                          aggregate_id text not null,
                          source_system text not null,
                          source_record_id text,
                          authority_tier text not null,
                          privacy_class text not null,
                          actor_type text not null,
                          actor_id text,
                          correlation_id text,
                          causation_id text,
                          occurred_at timestamptz not null,
                          recorded_at timestamptz not null,
                          freshness_at timestamptz not null,
                          payload_json jsonb not null,
                          provenance_json jsonb not null
                      );
                  """)
                  cursor.execute(
                      """insert into public.charlie_missions
                         (mission_id,status,metadata_json,updated_at)
                         values (%s,'paused',%s::jsonb,%s)""",
                      (
                          mission_id,
                          json.dumps({"mission_family": {
                              "root_mission_id": root_mission_id
                          }}),
                          now,
                      ),
                  )
                  cursor.execute(
                      """insert into public.charlie_mission_events
                         (event_id,mission_id,event_type,notes,recorded_by,
                          metadata_json,created_at)
                         values (%s,%s,'owner_correction_recorded',%s,
                                 'owner-charl',%s::jsonb,%s)""",
                      (
                          correction["event_id"],
                          mission_id,
                          correction["summary"],
                          json.dumps(correction),
                          now,
                      ),
                  )
                  for claim in claims:
                      if claim["headRefName"] == os.environ["CURRENT_HEAD_REF"]:
                          continue
                      metadata = {"review_packet": {
                          "changed_files": sorted(
                              row["path"]
                              for row in claim["files"]["nodes"]
                          )
                      }}
                      cursor.execute(
                          """insert into public.charlie_missions
                             (mission_id,status,metadata_json,updated_at)
                             values (%s,'approved',%s::jsonb,%s)""",
                          (
                              f"GITHUB-PR-{claim['number']}",
                              json.dumps(metadata),
                              claim["updatedAt"],
                          ),
                      )
          PY
      - name: Validate complete exact candidate
        shell: bash
        env:
          VALIDATION_RECEIPT_KEY_B64: ${{ secrets.CHARLIE_VALIDATION_RECEIPT_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          test -n "$VALIDATION_RECEIPT_KEY_B64"
          install -m 700 -d .charlie_runner
          printf '%s' "$VALIDATION_RECEIPT_KEY_B64" | base64 --decode \
            > .charlie_runner/validation-receipt.key
          chmod 600 .charlie_runner/validation-receipt.key
          if [ "${{ github.head_ref }}" = "cursor/mission-admission-stage2-20260827" ]; then
            admitted_head=""
            for _attempt in $(seq 1 12); do
              body="$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq .body)"
              admitted_head="$(printf '%s' "$body" | sed -n 's/^Stage2-Admission-Head: \([0-9a-f]\{40\}\)$/\1/p')"
              [ "$admitted_head" = "$head" ] && break
              sleep 5
            done
            test "$admitted_head" = "$head"
            export CHARLIE_STAGE2_ADMITTED_HEAD="$admitted_head"
            CI=true python scripts/charlie_mission_admission_guard.py \
              issue-stage2 --base "$base" --head "$head"
            export CHARLIE_MISSION_ADMISSION_STATE_ROOT="$PWD/.charlie_runner"
            export CHARLIE_MISSION_ADMISSION_MISSION_ID="CMQ-20260813-05-STAGE2-ADMISSION"
            python scripts/charlie_mission_admission_guard.py ci \
              --base "$base" --head "$head"
          else
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} \
              > "$RUNNER_TEMP/pull-request.json"
            python - <<'PY'
          import base64
          import binascii
          import json
          import os
          import re

          source = os.path.join(os.environ["RUNNER_TEMP"], "pull-request.json")
          target = os.path.join(
              os.environ["RUNNER_TEMP"], "mission-admission-receipt.json"
          )
          body = str(json.load(open(source, encoding="utf-8")).get("body") or "")
          matches = re.findall(
              r"(?m)^Mission-Admission-Receipt-B64: ([A-Za-z0-9+/]+={0,2})\r?$",
              body,
          )
          if len(matches) != 1:
              raise SystemExit("exactly_one_external_admission_receipt_required")
          try:
              decoded = base64.b64decode(matches[0], validate=True)
              receipt = json.loads(decoded)
          except (binascii.Error, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit("external_admission_receipt_invalid") from exc
          with open(target, "w", encoding="utf-8") as output:
              json.dump(receipt, output, sort_keys=True, separators=(",", ":"))
          PY
            python scripts/charlie_mission_admission_guard.py ci-external \
              --receipt "$RUNNER_TEMP/mission-admission-receipt.json" \
              --base "$base" --head "$head"
          fi

  charlie-core:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CHARLIE_TEST_ISOLATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run isolated CHARLIE modules with hard timeouts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            (
              control_root="$(mktemp -d "${RUNNER_TEMP}/charlie-test-control.XXXXXX")"
              cleanup_control_root() {
                case "$control_root" in
                  "${RUNNER_TEMP}/charlie-test-control."*) rm -rf -- "$control_root" ;;
                  *) echo "::error::Refusing unsafe CHARLIE test cleanup path: $control_root"; exit 1 ;;
                esac
              }
              trap cleanup_control_root EXIT
              export CHARLIE_TEST_CONTROL_ROOT="$control_root"
              unset CHARLIE_PROCESS_TERMINATION_ENABLED CHARLIE_SUBPROCESS_TESTS_ENABLED
              module="${test_file%.py}"
              module="${module//\//.}"
              echo "::group::$module"
              timeout 120s python -m unittest "$module" -q
              echo "::endgroup::"
            )
          done < <(find tests -maxdepth 1 -name 'test_charlie_*.py' -print | sort)
          python -m unittest tests.test_control_tower_feedback tests.test_shadow_control_tower tests.test_shadow_control_tower_input
          python -m unittest tests.test_portfolio_classification
          python -m unittest tests.test_render_production_migration_rail -q
