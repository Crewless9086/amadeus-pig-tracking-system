name: OOM Desktop Rebind Qualification
on:
  push:
    branches: [codex/core-successful-stop-registration-qualification-20261012]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oom_desktop_rebind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d oom_desktop_rebind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OOM_DESKTOP_REBIND_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oom_desktop_rebind_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Prove successful stop, PR1389 lineage and source-only release
        run: python -m unittest tests.test_oom_desktop_candidate_reconciliation -v
      - name: Prove compact HTTPS registration, atomic rollback and zero-write replay
        run: python -m unittest tests.test_oom_desktop_registration_sql -v
      - name: Prove bounded pre-send metadata correction and rollback
        run: python -m pytest tests/test_oom_presend_timeout_correction.py -q
      - name: Prove one-time unsent expiry extension, rejection and replay
        run: python -m pytest tests/test_oom_unsent_confirmation_extension.py -q
  # Native six-case qualification is separate: run38219852069 at workflow
  # b7a4824cbff8ed37c0b2fc2f725533bbfbf112f3, harness1a1d343c93e904d170cfb22a80cfe35c0dd11723,
  # application9449ebd1f3b32be4c6f661dde9f7cc81bd3f1c61. Do not replay stale four-case proof.
