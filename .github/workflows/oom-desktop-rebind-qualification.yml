name: OOM Desktop Rebind Qualification
on:
  push:
    branches: [codex/oom-retained-followup-registration-20260921]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oom_desktop_rebind_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d oom_desktop_rebind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OOM_DESKTOP_REBIND_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oom_desktop_rebind_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prove exact Desktop binding, rollback and replay
        run: python -m unittest tests.test_oom_desktop_candidate_reconciliation -v
