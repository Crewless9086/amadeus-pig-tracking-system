name: Oom Sakkie Audit Rails

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit-rails:
    name: Unit tests with disposable Postgres audit rails
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amadeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amadeus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amadeus_test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare Riversdale source-writer tables
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("""
                      do $$
                      begin
                          create role anon nologin;
                      exception when duplicate_object then null;
                      end $$;
                      do $$
                      begin
                          create role authenticated nologin;
                      exception when duplicate_object then null;
                      end $$;
                      do $$
                      begin
                          create role service_role nologin bypassrls;
                      exception when duplicate_object then null;
                      end $$;
                      alter default privileges in schema public
                          grant all privileges on tables to service_role;
                      create table if not exists public.order_lines (
                          order_line_id text primary key, order_id text, pig_id text,
                          line_status text not null default 'Draft', reserved_status text not null default 'Not_Reserved'
                      );
                      create table if not exists public.sales_transactions (
                          sale_id text primary key, sale_stream text not null,
                          sale_status text not null default 'Draft'
                      );
                      create table if not exists public.sales_transaction_items (
                          sale_item_id text primary key, sale_id text not null,
                          pig_id text, order_line_id text
                      );
                      create table if not exists public.meat_processing_batches (
                          batch_id text primary key, status text not null
                      );
                      create table if not exists public.meat_processing_batch_pigs (
                          batch_pig_id text primary key, batch_id text not null, pig_id text not null
                      );
                  """)
          PY

      - name: Apply Oom Sakkie audit migrations
        run: |
          python scripts/apply_supabase_migration.py supabase/migrations/202605210001_foundation_migration_log.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202605210005_create_telemetry_power_tables.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202605220001_create_telemetry_weather_tables.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202605230001_create_irrigation_tables.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606280001_create_bulk_weight_batch_tables.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606290001_create_farm_canonical_tables.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606290003_add_litter_lifecycle_fields.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606060001_create_oom_sakkie_traces.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606060002_create_oom_sakkie_trace_feedback.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606060003_add_oom_sakkie_safety_notes.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606060004_lock_oom_sakkie_trace_append_only.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606070001_create_oom_sakkie_build_requests.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606070002_create_oom_sakkie_build_request_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606070003_create_oom_sakkie_patch_proposals.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606070004_create_oom_sakkie_deploy_decisions.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606080001_create_oom_sakkie_agent_dry_runs.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606080002_create_oom_sakkie_agent_dry_run_results.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606090001_create_oom_sakkie_dispatch_decisions.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606090002_create_oom_sakkie_dispatch_execution_approvals.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606090003_allow_single_shot_sentinel_dry_run_results.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606100001_create_oom_sakkie_learning_influence_proposals.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606110001_create_oom_sakkie_learning_influence_consumption_audit_rail.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606140001_create_oom_sakkie_sales_campaigns.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606140002_create_oom_sakkie_sales_leads.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160001_allow_sales_lead_owner_money_path_approval.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160002_allow_sales_lead_customer_followup_send_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160003_allow_sales_lead_booking_order_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160004_allow_sam_meat_autoreply_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160005_create_meat_price_book.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160006_create_meat_ops_rails.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160007_create_meat_instruction_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160008_create_meat_fulfillment_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606160009_create_meat_journey_notification_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606170001_create_meat_reservation_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606170002_extend_meat_deposit_event_types.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606170003_create_meat_reconciliation_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606180001_create_meat_sales_conversation_learning_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606180002_create_beacon_media_library.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606180003_create_beacon_manual_post_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606180004_create_beacon_campaign_performance_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606180005_create_beacon_facebook_post_execution_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606180006_extend_beacon_facebook_post_execution_statuses.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606180007_add_sales_lead_conversation_lookup_index.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202607230001_create_riversdale_auction_cycles.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202607250001_create_beacon_weekly_review_decisions.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202607260008_create_beacon_organic_media_learning.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202607270001_create_beacon_media_intake.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202607270002_create_rootline_operating_policies.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202606300001_create_charlie_mission_queue.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202607270003_create_charlie_owner_execution_holds.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608090001_create_rootline_water_balance_ledger.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608090002_fix_rootline_water_balance_pgcrypto_search_path.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202607210001_create_pig_lifecycle_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608110001_create_oom_protected_action_claims.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608120001_create_breeding_exposure_events.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608120002_allow_breeding_protected_claims.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608120003_add_breeding_exposure_group_identity.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608120004_add_exposure_breeding_cycle_windows.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608120005_add_active_exposure_cycle_state.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608060001_create_rootline_ewelink_oauth_vault.sql
          python scripts/apply_supabase_migration.py supabase/migrations/202608130001_serialize_rootline_ewelink_refresh.sql

      - name: Run Beacon weekly owner-decision permission gates
        env:
          BEACON_WEEKLY_REVIEW_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: python -m unittest tests.test_beacon_weekly_owner_review_decisions_postgres
      - name: Run Beacon organic-learning permission gates
        env:
          BEACON_WEEKLY_REVIEW_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: python -m unittest tests.test_beacon_organic_media_intelligence_postgres
      - name: Run Beacon private media-intake permission gates
        env:
          BEACON_WEEKLY_REVIEW_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: python -m unittest tests.test_beacon_media_intake_postgres
      - name: Run CHARLIE callback durability integration tests
        run: python -m unittest tests.test_charlie_callback_postgres

      - name: Run CHARLIE adaptive orchestration durable canary tests
        run: python -m unittest tests.test_charlie_adaptive_orchestration_postgres tests.test_charlie_owner_execution_hold_postgres

      - name: Run pig observation privilege gates
        run: CHARLIE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_pig_observation_event_postgres tests.test_herdmaster_breeding_observation_postgres

      - name: Run Herdmaster Weaning Day atomic transaction gates
        run: CHARLIE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_litter_weaning_atomic_postgres

      - name: Run Oom Sakkie protected breeding claim persistence gates
        run: OOM_PROTECTED_ACTION_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_oom_sakkie_protected_breeding_claim_postgres

      - name: Run Riversdale auction disposable-Postgres integration tests
        run: CHARLIE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_riversdale_auction_postgres

      - name: Run pig lifecycle audit disposable-Postgres tests
        run: CHARLIE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_pig_lifecycle_event_postgres

      - name: Run HERDMASTER grouped breeding exposure transaction gates
        run: CHARLIE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_herdmaster_breeding_exposure_postgres tests.test_breeding_exposure_group_migration_postgres

      - name: Run ROOTLINE plan-only ledger disposable-Postgres tests
        run: ROOTLINE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_irrigation_command_ledger_postgres tests.test_irrigation_daily_plan_postgres

      - name: Run ROOTLINE eWeLink refresh durability gates
        run: ROOTLINE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_rootline_ewelink_oauth_postgres

      - name: Run ROOTLINE Operating Knowledge policy-review permission gates
        run: ROOTLINE_POLICY_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_rootline_operating_policy_postgres

      - name: Run ROOTLINE Water and Energy Plan permission gates
        run: ROOTLINE_WATER_ENERGY_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m unittest tests.test_rootline_water_energy_plan_postgres

      - name: Run ROOTLINE effective-rainfall append and replay gates
        run: |
          python -m pip install pytest
          ROOTLINE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m pytest tests/test_rootline_water_balance.py -q

      - name: Run ROOTLINE irrigation job persistence and concurrency gates
        run: ROOTLINE_DISPOSABLE_POSTGRES_URL="$DATABASE_URL" python -m pytest tests/test_rootline_irrigation_execution_store.py -q

      - name: Run HERDMASTER breeding operating-loop gates
        run: |
          python - <<'PY'
          import tests.test_herdmaster_breeding_operating_loop as suite
          tests = [
              getattr(suite, name) for name in dir(suite)
              if name.startswith("test_")
          ]
          for test in tests:
              test()
          print(f"{len(tests)} HERDMASTER operating-loop gates passed")
          PY

      - name: Run SAM Meat PostgreSQL deadline gates without skips
        env:
          SAM_MEAT_DEADLINE_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: python -m unittest tests.test_sam_meat_database_deadline_postgres
      - name: Run SAM Meat production-shaped snapshot gates without skips
        env:
          SAM_MEAT_DEADLINE_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: python -m unittest tests.test_sam_meat_truth_snapshot_postgres
      - name: Run Oom Sakkie audit-rail suite with live checks enabled
        run: python -m unittest tests.test_oom_sakkie_service tests.test_oom_sakkie_routes tests.test_frontend_route_contracts tests.test_sales_transaction_routes tests.test_sam_meat_runtime tests.test_meat_price_book tests.test_meat_match_engine tests.test_meat_ops tests.test_meat_fulfillment tests.test_meat_reconciliation tests.test_sales_conversation_learning tests.test_beacon_media_library tests.test_beacon_campaign tests.test_beacon_media_intake tests.test_beacon_media_intake_routes

      - name: Check Oom Sakkie JavaScript syntax
        run: |
          node --check static/js/oomSakkie.js
          node --check static/js/meatSalesLeads.js
          node --check static/js/meatDriver.js
          node --check static/js/beaconMedia.js

      - name: Run Oom Sakkie browser behavior smoke
        run: node tests/oom_sakkie_browser_behavior_smoke.js
