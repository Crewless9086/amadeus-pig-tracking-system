            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | length) == 1 and
            .manifests[0].platform.os == "linux" and
            .manifests[0].platform.architecture == "arm64" and
            .manifests[0].digest == $manifest
