      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Verify stable existing tag, index, sole manifest and OCI config
        id: partial_existing
        shell: bash
