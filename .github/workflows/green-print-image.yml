          git cat-file -e "${DEVIATION_SIGNATURE_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${DEVIATION_SIGNATURE_SOURCE_COMMIT}" "${GITHUB_SHA}"
