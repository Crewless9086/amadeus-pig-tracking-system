name: Green Print immutable image

on:
  pull_request:
    paths:
      - ".github/workflows/green-print-image.yml"
      - "green_print_bridge/**"
      - "scripts/green_print_startup_apparmor_probe.py"
      - "scripts/green_print_attestation_inventory.py"
      - "scripts/green_print_sigstore_bundle_inventory.py"
      - "tests/test_green_print_home_assistant_app.py"
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact reviewed 40-character commit to publish
        required: true
        type: string
      publish:
        description: Publish the immutable 0.3.6 package artifact
        required: true
        default: false
        type: boolean
      recover_existing:
        description: Verify an already-published immutable 0.3.6 digest without publishing
        required: true
        default: false
        type: boolean
      expected_digest:
        description: Exact sha256 digest to verify in recovery mode
        required: false
        type: string
      complete_partial_publication:
        description: Verify already-completed 0.3.6 recovery evidence and emit its packet without any evidence mutation
        required: true
        default: false
        type: boolean
      expected_manifest_digest:
        description: Exact sole linux/arm64 manifest digest for partial-publication recovery
        required: false
        type: string
      original_publication_run_id:
        description: Exact failed publication workflow run that built and tagged the partial artifact
        required: false
        type: string
      existing_recovery_source_commit:
        description: Exact main revision that created already-existing recovery attestations during a failed recovery run
        required: false
        type: string
      existing_recovery_run_id:
        description: Exact failed recovery run that created the already-existing signature and attestations
        required: false
        type: string
      deviation_signature_source_commit:
        description: Exact main revision of the contained unauthorized signature effect
        required: false
        type: string
      deviation_signature_run_id:
        description: Exact contained run that appended the second native signature
        required: false
        type: string

concurrency:
  group: green-print-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/crewless9086/amadeus-green-print-bridge
  VERSION: 0.3.6

jobs:
  verify:
    name: Verify aarch64 package
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.recover_existing)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest PyYAML
      - name: Verify package contract
        run: python -m pytest tests/test_green_print_home_assistant_app.py -q
      - uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d # v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build exact linux arm64 image without publishing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: green_print_bridge
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_ARCH=aarch64
            BUILD_VERSION=${{ env.VERSION }}
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          tags: green-print-startup-probe:${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install AppArmor parser for the real startup contract
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apparmor-utils
          sudo aa-status --enabled
      - name: Run real arm64 zero-job startup under package AppArmor
        shell: bash
        env:
          PROBE_IMAGE: green-print-startup-probe:${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/green_print_startup_apparmor_probe.py --image "${PROBE_IMAGE}" --profile green_print_bridge/apparmor.txt

  publish:
    name: Publish signed immutable aarch64 package
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.recover_existing
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    outputs:
      digest: ${{ steps.pushed.outputs.resolved_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ inputs.expected_source_commit }}
      - name: Bind publication to exact reviewed commit and package version
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
        run: |
          [[ "${EXPECTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${EXPECTED_SOURCE_COMMIT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_COMMIT}"
          test "${GITHUB_REF}" = "refs/heads/main"
          grep -Fqx 'version: "0.3.6"' green_print_bridge/config.yaml
          grep -Fqx 'image: ghcr.io/crewless9086/amadeus-green-print-bridge' green_print_bridge/config.yaml
      - name: Authenticate only for the bounded package publication
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d # v3.6.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Prohibit version-tag replacement
        shell: bash
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "Refusing to replace existing ${IMAGE}:${VERSION}" >&2
            exit 1
          fi
      - name: Build and push untagged exact linux arm64 manifest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: green_print_bridge
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          build-args: |
            BUILD_ARCH=aarch64
            BUILD_VERSION=${{ env.VERSION }}
            SOURCE_COMMIT=${{ inputs.expected_source_commit }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.expected_source_commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Create the unique version tag as an arm64 index
        shell: bash
        env:
          BUILD_MANIFEST_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}@${BUILD_MANIFEST_DIGEST}"
      - name: Verify pushed index descriptor, config and OCI bindings
        id: pushed
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          BUILD_MANIFEST_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          tag_ref="${IMAGE}:${VERSION}"
          resolved_digest="$(docker buildx imagetools inspect "${tag_ref}" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "${resolved_digest}"
          docker buildx imagetools inspect "${tag_ref}" --raw > pushed-index.json
          jq -e --arg manifest "${BUILD_MANIFEST_DIGEST}" '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | length) == 1 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64" and .digest == $manifest)] | length) == 1
          ' pushed-index.json >/dev/null
          digest_ref="${IMAGE}@${resolved_digest}"
          docker buildx imagetools inspect "${digest_ref}" --format '{{json .Image}}' > pushed-image-config.json
          jq -e '.architecture == "arm64" and .os == "linux"' pushed-image-config.json >/dev/null
          jq -e --arg source "${EXPECTED_SOURCE_COMMIT}" '.config.Labels["org.opencontainers.image.revision"] == $source' pushed-image-config.json >/dev/null
          jq -e --arg repo "https://github.com/${GITHUB_REPOSITORY}" '.config.Labels["org.opencontainers.image.source"] == $repo' pushed-image-config.json >/dev/null
          jq -e --arg version "${VERSION}" '.config.Labels["org.opencontainers.image.version"] == $version' pushed-image-config.json >/dev/null
          echo "resolved_digest=${resolved_digest}" >> "${GITHUB_OUTPUT}"
          echo "index_sha256=$(sha256sum pushed-index.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "config_sha256=$(sha256sum pushed-image-config.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
      - name: Install pinned Cosign signer and verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keylessly sign verified arm64 index
        shell: bash
        run: cosign sign --yes "${IMAGE}@${{ steps.pushed.outputs.resolved_digest }}"
      - name: Install pinned Syft scanner
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.42.3
      - name: Generate SPDX SBOM from exact linux arm64 digest
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.syft.outputs.cmd }}" scan --platform linux/arm64 "registry:${IMAGE}@${{ steps.pushed.outputs.resolved_digest }}" --output "spdx-json=green-print-0.3.6.spdx.json"
          jq -e '.spdxVersion == "SPDX-2.3"' green-print-0.3.6.spdx.json >/dev/null
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.pushed.outputs.resolved_digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.pushed.outputs.resolved_digest }}
          sbom-path: green-print-0.3.6.spdx.json
          push-to-registry: true
      - name: Verify signature and digest-bound attestations
        id: verify
        shell: bash
        env:
          PRODUCED_DIGEST: ${{ steps.pushed.outputs.resolved_digest }}
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest_ref="${IMAGE}@${PRODUCED_DIGEST}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/green-print-image.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${digest_ref}" > cosign-verification.json
          gh attestation verify "oci://${digest_ref}" --repo "${GITHUB_REPOSITORY}" --predicate-type "https://slsa.dev/provenance/v1" --cert-identity "${identity}" --source-digest "${EXPECTED_SOURCE_COMMIT}" --source-ref "refs/heads/main" --deny-self-hosted-runners --format json > provenance-verification.json
          gh attestation verify "oci://${digest_ref}" --repo "${GITHUB_REPOSITORY}" --predicate-type "https://spdx.dev/Document/v2.3" --cert-identity "${identity}" --source-digest "${EXPECTED_SOURCE_COMMIT}" --source-ref "refs/heads/main" --deny-self-hosted-runners --format json > sbom-attestation-verification.json
          test "$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" | awk '$1 == "Digest:" {print $2; exit}')" = "${PRODUCED_DIGEST}"
          echo "cosign_sha256=$(sha256sum cosign-verification.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "provenance_sha256=$(sha256sum provenance-verification.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "sbom_attestation_sha256=$(sha256sum sbom-attestation-verification.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "sbom_sha256=$(sha256sum green-print-0.3.6.spdx.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
      - name: Emit digest-bound non-secret release receipt
        shell: bash
        run: |
          printf '%s\n' \
            "image=${IMAGE}" \
            "version=${VERSION}" \
            "source_commit=${{ inputs.expected_source_commit }}" \
            "digest=${{ steps.pushed.outputs.resolved_digest }}" \
            "tag_resolved_digest=${{ steps.pushed.outputs.resolved_digest }}" \
            "platform=linux/arm64" \
            "image_index_sha256=${{ steps.pushed.outputs.index_sha256 }}" \
            "image_config_sha256=${{ steps.pushed.outputs.config_sha256 }}" \
            "cosign_identity=https://github.com/${GITHUB_REPOSITORY}/.github/workflows/green-print-image.yml@refs/heads/main" \
            "cosign_issuer=https://token.actions.githubusercontent.com" \
            "cosign_verification_sha256=${{ steps.verify.outputs.cosign_sha256 }}" \
            "provenance_verification_sha256=${{ steps.verify.outputs.provenance_sha256 }}" \
            "sbom_attestation_verification_sha256=${{ steps.verify.outputs.sbom_attestation_sha256 }}" \
            "sbom_sha256=${{ steps.verify.outputs.sbom_sha256 }}" | tee green-print-image-receipt.txt
      - name: Preserve non-secret verified release packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: green-print-0.3.6-verified-release-packet
          if-no-files-found: error
          retention-days: 90
          path: |
            green-print-image-receipt.txt
            pushed-index.json
            pushed-image-config.json
            cosign-verification.json
            provenance-verification.json
            sbom-attestation-verification.json
            green-print-0.3.6.spdx.json

  recover:
    name: Recover verification for existing immutable aarch64 package
    if: github.event_name == 'workflow_dispatch' && inputs.recover_existing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - name: Bind recovery to exact source, digest, main and package version
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          test "${PUBLISH_REQUESTED}" = "false"
          [[ "${EXPECTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git cat-file -e "${EXPECTED_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${EXPECTED_SOURCE_COMMIT}" "${GITHUB_SHA}"
          test "$(git show "${EXPECTED_SOURCE_COMMIT}:green_print_bridge/config.yaml" | sed -n 's/^version: "\([^"]*\)"$/\1/p')" = "${VERSION}"
          test "$(git show "${EXPECTED_SOURCE_COMMIT}:green_print_bridge/config.yaml" | sed -n 's/^image: \(.*\)$/\1/p')" = "${IMAGE}"
      - name: Authenticate read-only package inspection
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Verify existing tag, index, arm64 config and immutable bindings
        id: existing
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          tag_ref="${IMAGE}:${VERSION}"
          tag_digest="$(docker buildx imagetools inspect "${tag_ref}" | awk '$1 == "Digest:" {print $2; exit}')"
          test "${tag_digest}" = "${EXPECTED_DIGEST}"
          digest_ref="${IMAGE}@${EXPECTED_DIGEST}"
          docker buildx imagetools inspect "${digest_ref}" --raw > recovered-index.json
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | length) == 1 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1
          ' recovered-index.json >/dev/null
          docker buildx imagetools inspect "${digest_ref}" --format '{{json .Image}}' > recovered-image-config.json
          jq -e '.architecture == "arm64" and .os == "linux"' recovered-image-config.json >/dev/null
          jq -e --arg source "${EXPECTED_SOURCE_COMMIT}" '.config.Labels["org.opencontainers.image.revision"] == $source' recovered-image-config.json >/dev/null
          jq -e --arg repo "https://github.com/${GITHUB_REPOSITORY}" '.config.Labels["org.opencontainers.image.source"] == $repo' recovered-image-config.json >/dev/null
          jq -e --arg version "${VERSION}" '.config.Labels["org.opencontainers.image.version"] == $version' recovered-image-config.json >/dev/null
          echo "index_sha256=$(sha256sum recovered-index.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "config_sha256=$(sha256sum recovered-image-config.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
      - name: Install pinned Cosign verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify existing signature and digest-bound attestations
        id: recovered_verify
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest_ref="${IMAGE}@${EXPECTED_DIGEST}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/green-print-image.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${digest_ref}" > recovered-cosign-verification.json
          gh attestation verify "oci://${digest_ref}" --repo "${GITHUB_REPOSITORY}" --predicate-type "https://slsa.dev/provenance/v1" --cert-identity "${identity}" --source-digest "${EXPECTED_SOURCE_COMMIT}" --source-ref "refs/heads/main" --deny-self-hosted-runners --format json > recovered-provenance-verification.json
          gh attestation verify "oci://${digest_ref}" --repo "${GITHUB_REPOSITORY}" --predicate-type "https://spdx.dev/Document/v2.3" --cert-identity "${identity}" --source-digest "${EXPECTED_SOURCE_COMMIT}" --source-ref "refs/heads/main" --deny-self-hosted-runners --format json > recovered-sbom-attestation-verification.json
          echo "cosign_sha256=$(sha256sum recovered-cosign-verification.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "provenance_sha256=$(sha256sum recovered-provenance-verification.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "sbom_attestation_sha256=$(sha256sum recovered-sbom-attestation-verification.json | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
      - name: Emit recovered digest-bound non-secret release receipt
        shell: bash
        run: |
          printf '%s\n' \
            "image=${IMAGE}" \
            "version=${VERSION}" \
            "source_commit=${{ inputs.expected_source_commit }}" \
            "digest=${{ inputs.expected_digest }}" \
            "tag_resolved_digest=${{ inputs.expected_digest }}" \
            "platform=linux/arm64" \
            "image_index_sha256=${{ steps.existing.outputs.index_sha256 }}" \
            "image_config_sha256=${{ steps.existing.outputs.config_sha256 }}" \
            "cosign_identity=https://github.com/${GITHUB_REPOSITORY}/.github/workflows/green-print-image.yml@refs/heads/main" \
            "cosign_issuer=https://token.actions.githubusercontent.com" \
            "cosign_verification_sha256=${{ steps.recovered_verify.outputs.cosign_sha256 }}" \
            "provenance_verification_sha256=${{ steps.recovered_verify.outputs.provenance_sha256 }}" \
            "sbom_attestation_verification_sha256=${{ steps.recovered_verify.outputs.sbom_attestation_sha256 }}" \
            "recovery_workflow_run_id=${GITHUB_RUN_ID}" | tee green-print-image-recovered-receipt.txt
      - name: Preserve recovered non-secret verified release packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: green-print-0.3.6-recovered-verified-release-packet
          if-no-files-found: error
          retention-days: 90
          path: |
            green-print-image-recovered-receipt.txt
            recovered-index.json
            recovered-image-config.json
            recovered-cosign-verification.json
            recovered-provenance-verification.json
            recovered-sbom-attestation-verification.json

  recover_partial_publication:
    name: Verify exact completed partial publication without evidence effects
    if: github.event_name == 'workflow_dispatch' && inputs.complete_partial_publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install exact native-bundle inspection dependency
        run: python -m pip install cryptography==45.0.7
      - name: Bind partial recovery to exact source, index, manifest and main
        shell: bash
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          VERIFY_ONLY_REQUESTED: ${{ inputs.recover_existing }}
          ORIGINAL_PUBLICATION_RUN_ID: ${{ inputs.original_publication_run_id }}
          EXISTING_RECOVERY_SOURCE_COMMIT: ${{ inputs.existing_recovery_source_commit }}
          EXISTING_RECOVERY_RUN_ID: ${{ inputs.existing_recovery_run_id }}
          DEVIATION_SIGNATURE_SOURCE_COMMIT: ${{ inputs.deviation_signature_source_commit }}
          DEVIATION_SIGNATURE_RUN_ID: ${{ inputs.deviation_signature_run_id }}
        run: |
          set -euo pipefail
          test "${PUBLISH_REQUESTED}" = "false"
          test "${VERIFY_ONLY_REQUESTED}" = "false"
          [[ "${EXPECTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${EXPECTED_MANIFEST_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${ORIGINAL_PUBLICATION_RUN_ID}" =~ ^[1-9][0-9]{5,19}$ ]]
          [[ "${EXISTING_RECOVERY_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXISTING_RECOVERY_RUN_ID}" =~ ^[1-9][0-9]{5,19}$ ]]
          [[ "${DEVIATION_SIGNATURE_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${DEVIATION_SIGNATURE_RUN_ID}" =~ ^[1-9][0-9]{5,19}$ ]]
          test "${EXISTING_RECOVERY_SOURCE_COMMIT}" != "${EXPECTED_SOURCE_COMMIT}"
          test "${DEVIATION_SIGNATURE_SOURCE_COMMIT}" != "${EXPECTED_SOURCE_COMMIT}"
          test "${DEVIATION_SIGNATURE_SOURCE_COMMIT}" != "${EXISTING_RECOVERY_SOURCE_COMMIT}"
