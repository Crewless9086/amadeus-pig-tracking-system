name: Trusted Mission Admission

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-mission-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-trusted-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: charlie-admission-validator
    steps:
      - name: Checkout protected base only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Use protected-base Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install protected-base dependencies
        run: python -m pip install -r requirements.txt
      - name: Mint least-privilege App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.CHARLIE_ADMISSION_APP_ID }}
          private-key: ${{ secrets.CHARLIE_ADMISSION_APP_PRIVATE_KEY }}
          owner: Crewless9086
          repositories: amadeus-pig-tracking-system
      - name: Verify event and publish App check
        env:
          CHARLIE_ADMISSION_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CHARLIE_ADMISSION_CANONICAL_BINDING_B64: ${{ secrets.CHARLIE_ADMISSION_CANONICAL_BINDING_B64 }}
        run: >-
          python scripts/charlie_mission_admission_guard.py trusted-check
          --event "$GITHUB_EVENT_PATH"
