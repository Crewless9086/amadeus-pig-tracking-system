services:
  - type: worker
    name: charlie-native-runner
    runtime: docker
    repo: https://github.com/Crewless9086/amadeus-pig-tracking-system
    branch: main
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 300
    notificationOverride: failure
    dockerfilePath: ./deploy/charlie-native-runner/Dockerfile.render
    dockerContext: .
    disk:
      name: charlie-native-runner-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: CHARLIE_CANONICAL_API_URL
        value: https://amadeus-pig-tracking-system.onrender.com
      - key: CHARLIE_HERMES_GATEWAY_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: CHARLIE_SLACK_OWNER_USER_ID
        value: U0BSRQJASRG
      - key: CHARLIE_SLACK_CHARLIE_CHANNEL_ID
        value: C0BSRQJ60KC
      - key: CHARLIE_SLACK_BUILD_CHANNEL_ID
        value: C0BSTB5FQ5Q
      - key: CHARLIE_SLACK_APPROVALS_CHANNEL_ID
        value: C0BTMNW0MT2
      - key: CURSOR_API_KEY
        sync: false
      - key: CHARLIE_GITHUB_PACKAGER_TOKEN
        sync: false
      - key: CHARLIE_GITHUB_READ_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CHARLIE_NATIVE_MODEL_PROVIDER
        value: openrouter
      - key: CHARLIE_NATIVE_MODEL
        value: openai/gpt-5-mini
